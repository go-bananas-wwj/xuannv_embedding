[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xuannv-embedding"
version = "0.1.0"
description = "Region-agnostic monthly geospatial embeddings for multi-source Earth observation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Weijie Wu" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24,<2",
    "PyYAML>=6.0",
    "torch==2.6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
npu = ["torch-npu==2.12.0"]
data-process = [
    "geopandas>=0.14",
    "pandas>=2.0",
    "planetary-computer>=1.0",
    "pyarrow>=14",
    "pyogrio>=0.7",
    "pyproj>=3.6",
    "pystac-client>=0.7",
    "rasterio>=1.3",
    "requests>=2.31",
    "shapely>=2.0",
    "stackstac>=0.5",
    "xarray>=2023.0",
    "zarr>=2.16,<3",
]
downstream = [
    "matplotlib>=3.7",
    "scikit-image>=0.21",
    "scikit-learn>=1.3",
    "seaborn>=0.12",
]
dev = [
    "black>=24.0",
    "build>=1.2",
    "pip-audit>=2.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "twine>=5.0",
]

[project.scripts]
xuannv = "xuannv_embedding.cli:main"

[project.urls]
Homepage = "https://github.com/go-bananas-wwj/xuannv_embedding"
Repository = "https://github.com/go-bananas-wwj/xuannv_embedding"
Issues = "https://github.com/go-bananas-wwj/xuannv_embedding/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xuannv_embedding = ["export/*.json"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
