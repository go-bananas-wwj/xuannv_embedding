schema_version: "2"
paths:
  data_root: /data2/xuannv_embedding/v2
  source_root: /data2/china_xuannv_embedding/data
  grid_package: /data/xuannv_embedding/outputs/china_full_1280m_grid_package_v1_20260805
  auxiliary_roots:
    aef: /data2/china_xuannv_embedding/data/aef-labels
    static: /data2/china_xuannv_embedding/data/static
network_policy:
  allow_remote_metadata: false
  allow_remote_pixels: false
  missing_local_observation: mask
products:
  s2_local:
    role: dense
    bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
    native_gsd_m: [10, 10, 10, 20, 20, 20, 10, 20, 20, 20]
    stored_gsd_m: 10
    dtype: uint16
    time_precision: month
    already_resampled: true
    qa_available: false
  s1_local:
    role: dense
    bands: [vh, vv]
    native_gsd_m: [20, 20]
    stored_gsd_m: 10
    dtype: float32
    time_precision: month
    already_resampled: true
    qa_available: false
  landsat_local:
    role: dense
    bands: [red, green, blue, nir08, swir16, swir22]
    native_gsd_m: [30, 30, 30, 30, 30, 30]
    stored_gsd_m: 29.76744186
    dtype: uint16
    time_precision: month
    already_resampled: false
    qa_available: false
temporal:
  mode: causal_window
  dense_lookback_days: 365
  highres_structure_days: 730
  highres_appearance_days: 90
  highres_structure_max_observations: 8
  highres_appearance_max_observations: 4
model:
  embedding_dim: 64
  stem_dim: 64
  spatial_dim: 768
  temporal_dim: 384
  precision_dim: 192
  num_blocks: 8
  num_heads: 12
  gradient_checkpointing: true
training:
  epochs: 800
  lr: 2.0e-6
  weight_decay: 0.05
  batch_size: 2
  gradient_accumulation_steps: 8
  amp: true
  reconstruction_weights:
    s2_local: 1.0
    s1_local: 0.5
    landsat_local: 0.5
  uniformity_weight: 0.01
  uniformity_warmup_epochs: 10
  uniformity_temperature: 2.0
  # 全国 OSM building 尚未物化成 patch label；稠密 2020-2021 smoke 不虚构标签。
  semantic_probe_weight: 0.0
  semantic_probe_warmup_epochs: 80
  semantic_probe_tasks: []
  semantic_probe_hidden_dim: 64
  highres_detail_weight: 0.0
validation_profiles:
  mini-real:
    records: 16
    steps: 2
    batch_size: 2
    spatial_size: 32
    model_profile: mini
    resume_steps: 1
    overfit_steps: 20
  smoke:
    records: 652
    steps: 50
    batch_size: 1
    spatial_size: 128
    model_profile: production
    resume_steps: 1
    overfit_steps: 0
  npu-smoke:
    records: 652
    steps: 100
    batch_size: 1
    spatial_size: 128
    model_profile: production
    resume_steps: 1
    overfit_steps: 0
