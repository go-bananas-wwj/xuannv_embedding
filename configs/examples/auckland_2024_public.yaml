# Portable copy of the registered experiment; edit paths for a local dataset.
# Launcher micro batches: public=8, LINZ=4; effective batch=48.
schema_version: '1'
paths:
  data_root: data/auckland_west_2024
  output_root: outputs/auckland_2024
  artifact_root: artifacts/auckland_2024
experiment:
  name: auckland_2024_public
  seed: 41
  output_dir: outputs/auckland_2024/public
model:
  embed_dim: 64
  stem_dim: 32
  num_months: 12
  ref_year: 2024
  ref_month: 1
  input_sources:
    s2:
      channels: 12
      role: temporal
    s1:
      channels: 2
      role: temporal
    landsat:
      channels: 7
      role: temporal
  target_heads:
    s2_recon:
      source: s2
      loss_type: continuous
      channels: 12
      weight: 0.4
    s1_recon:
      source: s1
      loss_type: continuous
      channels: 2
      weight: 0.125
    landsat_recon:
      source: landsat
      loss_type: continuous
      channels: 7
      weight: 0.225
    worldcover:
      source: worldcover
      loss_type: categorical
      channels: 12
      weight: 0.45
  stp:
    space_dim: 512
    time_dim: 256
    precision_dim: 128
    precision_scale: 1
    num_blocks: 6
    num_heads: 8
    temporal_fusion: gated_sum
    time_attention_mode: full
    highres_fusion_to_embedding: true
  highres_transformer: null
training:
  epochs: 800
  lr: 0.0001
  weight_decay: 0.05
  warmup_epochs: 0
  gradient_accumulation_steps: 1
  save_every: 100
  amp: true
  gradient_checkpointing: true
  uniformity_weight: 0.06
  uniformity_warmup_epochs: 0
  uniformity_temperature: 2.0
  semantic_probe_weight: 0.4
  semantic_probe_warmup_epochs: 0
  semantic_probe_tasks:
  - osm_building
  - osm_major_road
  - osm_minor_road
  - osm_rail
  - osm_water
  - osm_green
  - osm_agriculture
  - osm_residential
  - osm_commercial
  - osm_industrial
  - osm_construction
  - osm_path_walk
  - osm_playground
  semantic_probe_task_weights:
    osm_building: 1.3
    osm_major_road: 1.4
    osm_minor_road: 1.2
    osm_rail: 0.8
    osm_water: 1.3
    osm_green: 0.8
    osm_agriculture: 0.8
    osm_residential: 0.6
    osm_commercial: 0.6
    osm_industrial: 0.6
    osm_construction: 0.6
    osm_path_walk: 0.6
    osm_playground: 0.5
  semantic_probe_pos_weight: 2.0
  semantic_probe_pos_weights:
    osm_building: 3
    osm_major_road: 3.5
    osm_minor_road: 3.5
    osm_rail: 3
    osm_water: 2
    osm_green: 1.8
    osm_agriculture: 2.5
    osm_residential: 1.8
    osm_commercial: 2.5
    osm_industrial: 2.5
    osm_construction: 2.5
    osm_path_walk: 3.5
    osm_playground: 2
  semantic_probe_hidden_dim: 0
  semantic_probe_hard_negative_ratio: 0.02
  semantic_probe_hard_negative_weight: 0.35
  semantic_probe_hard_negative_warmup_epochs: 0
  input_masking:
    enabled: true
    drop_availability_masks: false
    modality_dropout_probs:
      s2: 0.05
      s1: 0.1
      landsat: 0.1
    month_dropout_prob: 0.15
    max_months_per_sample: 1
    spatial_block_prob: 0.15
    spatial_block_size: 16
    spatial_block_ratio: 0.1
  semantic_probe_pooling: mean
data:
  months:
  - 2024-01
  - 2024-02
  - 2024-03
  - 2024-04
  - 2024-05
  - 2024-06
  - 2024-07
  - 2024-08
  - 2024-09
  - 2024-10
  - 2024-11
  - 2024-12
  batch_size: 4
  num_workers: 0
  patch_size: 128
  datasets:
  - region: auckland_west_2024
    manifest_path: data/auckland_west_2024/processed/manifest.json
    statistics_dir: data/auckland_west_2024/statistics
    patch_grid_path: data/auckland_west_2024/processed/patch_grid.json
    source_map:
      s2: s2
      s1: s1
      landsat: landsat
      worldcover: worldcover
    supervised_label_roots:
      osm_building: data/auckland_west_2024/processed/labels/osm_building
      osm_major_road: data/auckland_west_2024/processed/labels/osm_major_road
      osm_minor_road: data/auckland_west_2024/processed/labels/osm_minor_road
      osm_rail: data/auckland_west_2024/processed/labels/osm_rail
      osm_water: data/auckland_west_2024/processed/labels/osm_water
      osm_green: data/auckland_west_2024/processed/labels/osm_green
      osm_agriculture: data/auckland_west_2024/processed/labels/osm_agriculture
      osm_residential: data/auckland_west_2024/processed/labels/osm_residential
      osm_commercial: data/auckland_west_2024/processed/labels/osm_commercial
      osm_industrial: data/auckland_west_2024/processed/labels/osm_industrial
      osm_construction: data/auckland_west_2024/processed/labels/osm_construction
      osm_path_walk: data/auckland_west_2024/processed/labels/osm_path_walk
      osm_playground: data/auckland_west_2024/processed/labels/osm_playground
    sampling_weight: 1.0
  monthly_highres: false
  highres_month_assignments: {}
